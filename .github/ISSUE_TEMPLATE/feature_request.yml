name: Feature request
description: Suggest a focused improvement that fits Zedless's local-first scope
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Zedless deliberately excludes accounts, AI agents, cloud collaboration
        and an extension store. Requests that re-introduce those are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Smallest change that solves it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Editor core / LSP
        - UI / keybindings / themes
        - Terminal / git / debugger
        - Packaging / install / docs
        - Performance / memory
    validations:
      required: true
